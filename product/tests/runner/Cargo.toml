[package]
name = "vanllia-verification"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "verify"
path = "main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
toml = "0.9"
vanllia-build = { path = "../../../crates/build" }

sha2 = "0.10"
