[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
rustflags = ["-Crelocation-model=static", "-Cforce-frame-pointers=yes", "-Ccode-model=medium"]

[alias]
# The host adapter must run for the host, never for the freestanding target.
image = "run --locked -p vanllia-image --target x86_64-unknown-linux-gnu --"
