[workspace]
resolver = "2"
members = ["guest", "platform"]
[workspace.dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "66a90a597d3b3233e95b32d4bc685fbbae5f3bdc", features = ["memory-v11"] }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "66a90a597d3b3233e95b32d4bc685fbbae5f3bdc", features = ["memory-v11"] }
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "66a90a597d3b3233e95b32d4bc685fbbae5f3bdc", features = ["memory-v11"] }
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
