[package]
name = "platform-riscv-candidate"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[lib]
name = "platform_riscv"
path = "../../../platform/riscv/src/lib.rs"
test = false
doctest = false

[features]
default = ["image"]
image = ["dep:kernel", "dep:spin"]

[dependencies]
kernel-api.workspace = true
fdt = { version = "0.1.5", default-features = false }
fack = { version = "0.2.0", default-features = false }
spin = { version = "0.10", default-features = false, features = ["once"], optional = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
kernel = { workspace = true, optional = true }
