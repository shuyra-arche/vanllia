[package]
name = "vanllia-verification"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "verify"
path = "main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.9"

kernel-verification = { git = "https://github.com/shuyra-arche/kernel.git", rev = "a3d7a04ce2c3e007b2ee9a622969b00287bb77c0" }
