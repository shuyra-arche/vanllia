[package]
name = "vanllia-verification"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "verify"
path = "main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.9"
vanllia-build = { path = "../../crates/build" }

kernel-verification = { git = "https://github.com/shuyra-arche/kernel.git", rev = "789ffd19b5359f3de172fb9aad8a61f6a7113a64" }
