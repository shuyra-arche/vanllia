[package]
name = "vanllia-verification"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]

[[bin]]
name = "verify"
path = "main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.9"

kernel-verification = { git = "https://github.com/shuyra-arche/kernel.git", rev = "0f1be87884141732f6024920e549143f673bd975" }
