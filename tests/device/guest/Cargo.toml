[package]
name = "vanllia-device-guest"
version = "0.0.0"
edition = "2024"
publish = false
[features]
crash = []
readonly = []
activation_exit = []
[workspace]
[[bin]]
name = "device-guest"
path = "main.rs"
test = false
bench = false
[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "93db75f6dd364ce02d498e91e2af9625b3be8c24" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "93db75f6dd364ce02d498e91e2af9625b3be8c24" }
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
