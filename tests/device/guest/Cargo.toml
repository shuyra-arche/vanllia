[package]
name = "vanllia-device-guest"
version = "0.0.0"
edition = "2024"
publish = false
[features]
crash = []
readonly = []
activation_exit = []
[workspace]
[[bin]]
name = "device-guest"
path = "main.rs"
test = false
bench = false
[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "35e31efb49b69deba5f901d1be41e915f5a4e7a8" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "35e31efb49b69deba5f901d1be41e915f5a4e7a8" }
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
