[package]
name = "vanllia-device-guest"
version = "0.0.0"
edition = "2024"
publish = false
[features]
crash = []
readonly = []
activation_exit = []
route_revoke = []
[workspace]
[[bin]]
name = "device-guest"
path = "main.rs"
test = false
bench = false
[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "5e6ea8ff5f48f5ce17c88d98cbedcc7a0ffe3a9e" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "5e6ea8ff5f48f5ce17c88d98cbedcc7a0ffe3a9e" }
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
