[package]
name = "kernel-qemu-fixture"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[features]
default = ["image"]
image = ["platform-riscv/image"]

[workspace]

[[bin]]
name = "shuyra-qemu"
path = "main.rs"
required-features = ["image"]
test = false
bench = false

[[test]]
name = "pci"
path = "tests/pci/mod.rs"

[dependencies]
platform-riscv = { path = "../../../platform/riscv", default-features = false }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "7d714f6dc8f2ff09a61169aab7b99597860dba7e" }
fdt = { version = "0.1.5", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "7d714f6dc8f2ff09a61169aab7b99597860dba7e" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
