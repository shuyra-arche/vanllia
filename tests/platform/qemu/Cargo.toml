[package]
name = "kernel-qemu-fixture"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[features]
default = ["image"]
image = []

[workspace]

[[bin]]
name = "shuyra-qemu"
path = "main.rs"
required-features = ["image"]
test = false
bench = false

[[test]]
name = "pci"
path = "tests/pci/mod.rs"

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "f52d8c3f97c2dcefb8092ae03a631e3613e88a4a" }
fdt = { version = "0.1.5", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "f52d8c3f97c2dcefb8092ae03a631e3613e88a4a" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
