[package]
name = "platform-riscv"
version = "0.0.1"
edition = "2024"
publish = false
autotests = false

[workspace]

[features]
default = ["image"]
image = ["dep:kernel", "dep:spin"]

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "052061a8a1cd71a63aeff3d9f19cd2c9a12758dc", features = ["memory-v11"] }
fdt = { version = "0.1.5", default-features = false }
fack = { version = "0.2.0", default-features = false }
spin = { version = "0.10", default-features = false, features = ["once"], optional = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "052061a8a1cd71a63aeff3d9f19cd2c9a12758dc", features = ["memory-v11"], optional = true }

[[bin]]
name = "shuyra"
path = "src/main.rs"
required-features = ["image"]
test = false
bench = false

[[test]]
name = "boot"
path = "tests/boot/mod.rs"

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
