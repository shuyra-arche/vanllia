name: Native ABI 14 candidate

# Candidate verification only. The ABI 13 product pins and release gate stay intact.
on:
  pull_request:
    paths:
      - '.github/workflows/native-abi14.yml'
      - 'tests/memory/**'
      - 'tests/runner/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-abi14-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  native:
    name: ABI 14 native debug
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: nightly
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install build and execution tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git \
            build-essential python3 qemu-system-riscv opensbi clang llvm
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" \
            --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select ABI 14 Kernel candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/kernel
          ref: 17c6548a2a683c0ee09a3305d94991ddfa0d8cfe
          path: .integration/kernel
          persist-credentials: false
      - name: Run candidate Native composition
        run: |
          set -euo pipefail
          rustc -Vv
          qemu-system-riscv64 --version
          cargo run --locked --manifest-path tests/runner/Cargo.toml \
            --target x86_64-unknown-linux-gnu -- native \
            --kernel "$GITHUB_WORKSPACE/.integration/kernel" \
            --fixture "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/.integration/native-abi14" \
            --capsule-version 14
      - name: Symbolize fatal against exact platform ELF
        if: failure()
        run: |
          elf=.integration/native-abi14/platform.elf
          log=.integration/native-abi14/boot/serial.log
          if [[ -f "$elf" && -f "$log" ]] && grep -q '\[kernel\] fatal' "$log"; then
            cargo +nightly run --locked --manifest-path \
              .integration/kernel/server/tests/runner/Cargo.toml \
              --target x86_64-unknown-linux-gnu -- symbolize \
              "$elf" "$log" --addr2line llvm-addr2line
          fi
      - name: Report build or QEMU failure
        if: failure()
        run: |
          for step in resolve build boot; do
            dir=".integration/native-abi14/$step"
            for file in "$dir/stderr.log" "$dir/serial.log" "$dir/result.json"; do
              if [[ -f "$file" ]]; then
                echo "::group::$file"
                tail -n 160 "$file"
                echo "::endgroup::"
              fi
            done
          done
      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-abi14-debug
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .integration/native-abi14/inputs.json
            .integration/native-abi14/resolve/*
            .integration/native-abi14/build/*
            .integration/native-abi14/boot/*
            .integration/native-abi14/Cargo.lock
