name: Platform
on:
  pull_request:
    paths: ["platform/**", "tests/platform/**", ".github/workflows/platform.yml"]
  push:
    branches: [main]
    paths: ["platform/**", "tests/platform/**", ".github/workflows/platform.yml"]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: nightly
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup toolchain install nightly --profile minimal --component rustfmt --target riscv64gc-unknown-none-elf
      - name: Check formatting and portable admission
        env:
          RUSTFLAGS: "-Dwarnings"
        run: |
          cargo fmt --manifest-path platform/riscv/Cargo.toml -- --check
          cargo fmt --manifest-path tests/platform/qemu/Cargo.toml -- --check
          cargo fmt --manifest-path tests/platform/hardware/Cargo.toml -- --check
          cargo test --locked --manifest-path platform/riscv/Cargo.toml --no-default-features --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path tests/platform/qemu/Cargo.toml --no-default-features --target x86_64-unknown-linux-gnu
      - name: Build the pinned provider and both boot images
        env:
          RUSTFLAGS: "-Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium -Dwarnings"
        run: |
          cargo build --locked --manifest-path platform/riscv/Cargo.toml --target riscv64gc-unknown-none-elf
          cargo build --locked --manifest-path platform/riscv/Cargo.toml --release --target riscv64gc-unknown-none-elf
          cargo build --locked --manifest-path tests/platform/qemu/Cargo.toml --target riscv64gc-unknown-none-elf
          cargo build --locked --manifest-path tests/platform/qemu/Cargo.toml --release --target riscv64gc-unknown-none-elf
