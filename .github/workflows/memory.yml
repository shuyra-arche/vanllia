name: Native memory
on:
  pull_request:
    paths: ["tests/memory/**", "tests/runner/**", "platform/riscv/**", ".github/workflows/memory.yml"]
  push:
    branches: [main]
    paths: ["tests/memory/**", "tests/runner/**", "platform/riscv/**", ".github/workflows/memory.yml"]
permissions:
  contents: read
concurrency:
  group: memory-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  integration:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
      RUSTFLAGS: "-Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium -Dwarnings"
    steps:
      - name: Install image tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential qemu-system-riscv opensbi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain nightly --component rustfmt --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/kernel
          ref: 684f479c45dc2d94d405b32b4ffc6334a4233fc9
          path: .integration/kernel
          persist-credentials: false
      - name: Check formatting
        run: |
          cargo fmt --manifest-path tests/memory/Cargo.toml --all -- --check
          cargo fmt --manifest-path tests/runner/Cargo.toml -- --check
          cargo test --locked --manifest-path tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo run --locked --manifest-path tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu -- versions --fixture "$PWD"
      - name: Run pinned native image (debug)
        run: cargo run --locked --manifest-path tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu -- native --fixture "$PWD" --kernel .integration/kernel --output .integration/native-debug
      - name: Reject old Capsule in native image
        run: cargo run --locked --manifest-path tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu -- native --fixture "$PWD" --kernel .integration/kernel --output .integration/native-reject --capsule-version 10
      - name: Run pinned native image (release)
        run: cargo run --locked --manifest-path tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu -- native --fixture "$PWD" --kernel .integration/kernel --output .integration/native-release --profile release
      - name: Preserve images and serial evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-memory
          include-hidden-files: true
          path: |
            .integration/native-*/inputs.json
            .integration/native-*/*.elf
            .integration/native-*/*.bin
            .integration/native-*/*.lock
            .integration/native-*/boot/*
            .integration/native-*/build/*
            .integration/native-*/resolve/*
          if-no-files-found: error
