name: Kernel integration
on:
  pull_request:
    paths:
      - "product/tests/memory/**"
      - "product/tests/runner/**"
      - "platform/riscv/**"
      - "crates/build/**"
      - "components/kernel"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitmodules"
      - "vanllia.toml"
      - "vanllia.lock"
      - ".github/workflows/memory.yml"
  push:
    branches: [main]
    paths:
      - "product/tests/memory/**"
      - "product/tests/runner/**"
      - "platform/riscv/**"
      - "crates/build/**"
      - "components/kernel"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".gitmodules"
      - "vanllia.toml"
      - "vanllia.lock"
      - ".github/workflows/memory.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-integration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  host:
    name: Composition host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kernel_sha: ${{ steps.product.outputs.sha }}
      abi: ${{ steps.product.outputs.abi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select product Kernel revision
        id: product
        run: |
          set -euo pipefail
          read -r mode pin stage path <<< "$(git -c safe.directory="$GITHUB_WORKSPACE" ls-files --stage -- components/kernel)"
          [[ "$mode" == 160000 && "$stage" == 0 && "$path" == components/kernel ]]
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$pin" >> "$GITHUB_OUTPUT"
          case "$pin" in
            789ffd19b5359f3de172fb9aad8a61f6a7113a64) echo "abi=13" >> "$GITHUB_OUTPUT" ;;
            44d9593d89c4823a7599eb3ee3683bd7a5cee9b5) echo "abi=14" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unqualified product Kernel ABI pin: $pin" >&2; exit 1 ;;
          esac
      - name: Install host toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check composition tools
        run: |
          cargo fmt --manifest-path product/tests/memory/Cargo.toml --all -- --check
          cargo fmt --manifest-path product/tests/runner/Cargo.toml -- --check
          cargo clippy --locked --manifest-path product/tests/runner/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu -- -Dwarnings
          cargo test --locked --manifest-path product/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo run --locked --manifest-path product/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu -- versions --fixture .

  kernel-targets:
    name: Kernel-owned published ABI13 target contracts
    if: needs.host.outputs.abi == '13'
    needs: host
    uses: shuyra-arche/kernel/.github/workflows/pinned-target.yml@ec7adcde3d3c97b59630f52b000db3ded4f9e582
    with:
      kernel_sha: ${{ needs.host.outputs.kernel_sha }}

  kernel-abi14-targets:
    name: Kernel-owned ABI14 Nest completion
    if: needs.host.outputs.abi == '14'
    needs: host
    uses: shuyra-arche/kernel/.github/workflows/nest-target.yml@eceddad499a23b4521d3b36106516670ca68279d
    with:
      kernel_sha: ${{ needs.host.outputs.kernel_sha }}
      owner_sha: eceddad499a23b4521d3b36106516670ca68279d

  qemu:
    name: ${{ matrix.scenario }} / ${{ matrix.profile }} / h${{ matrix.harts }}
    needs: host
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Only Vanllia-owned composition/ABI contracts run here on one Hart.
        # Kernel's six private Activity/IRQ contracts are delegated to the
        # pinned Kernel-owned workflow; optional benchmarks remain separate.
        include:
          - { scenario: native, profile: debug, harts: "1" }
          - { scenario: native, profile: release, harts: "1" }
          - { scenario: reject, profile: debug, harts: "1" }
          - { scenario: reject12, profile: debug, harts: "1" }
          - { scenario: std, profile: release, harts: "1" }
    env:
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
    steps:
      - name: Install native image tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential python3 qemu-system-riscv opensbi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN" --target riscv64gc-unknown-none-elf
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch selected provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/kernel
          ref: ${{ needs.host.outputs.kernel_sha }}
          path: .integration/kernel
          persist-credentials: false
      - name: Fetch System consumer
        if: matrix.scenario == 'std'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/system
          ref: 470e97f38aa904c3702b665c0d225809b9f0d16e
          path: .integration/system
          persist-credentials: false
      - name: Fetch Toolchain std provider
        if: matrix.scenario == 'std'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuyra-arche/toolchain
          ref: 2e507cc6f473aaf0186d6c0a3f75c3a6adc0acd8
          path: .integration/toolchain
          persist-credentials: false
      - name: Execute this scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
          PROFILE: ${{ matrix.profile }}
          HARTS: ${{ matrix.harts }}
        run: |
          kernel="$GITHUB_WORKSPACE/.integration/kernel"
          evidence="$GITHUB_WORKSPACE/.integration/evidence"
          case "$SCENARIO" in
            std)
              toolchain="$GITHUB_WORKSPACE/.integration/toolchain"
              system="$GITHUB_WORKSPACE/.integration/system"
              rustup component add rust-src --toolchain "$RUSTUP_TOOLCHAIN"
              cargo run --locked --manifest-path "$toolchain/Cargo.toml" -- prepare-std --root "$toolchain"
              cargo run --locked --manifest-path "$toolchain/Cargo.toml" -- build-std --root "$toolchain"
              cargo build --locked --manifest-path "$system/tests/guest/runtime/platform/Cargo.toml" --features instructions --release --target riscv64gc-unknown-none-elf
              platform="$system/tests/guest/runtime/platform/target/riscv64gc-unknown-none-elf/release/system-runtime-platform"
              python3 "$system/tests/guest/loader/run.py" "$platform" --harts 1 --toolchain-receipt "$toolchain/build/std.json" --output "$evidence"
              ;;
            native|reject|reject12)
              cargo build --locked --manifest-path product/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
              runner="$GITHUB_WORKSPACE/product/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify"
              args=(native --profile "$PROFILE")
              if [[ "$SCENARIO" == reject ]]; then args+=(--capsule-version 10); fi
              if [[ "$SCENARIO" == reject12 ]]; then args+=(--capsule-version 12); fi
              "$runner" "${args[@]}" --kernel "$kernel" --fixture "$GITHUB_WORKSPACE" --output "$evidence"
              ;;
            *)
              echo "unknown composition scenario: $SCENARIO" >&2
              exit 1
              ;;
          esac
      - name: Preserve build and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-${{ matrix.scenario }}-${{ matrix.profile }}-h${{ matrix.harts }}
          include-hidden-files: true
          path: |
            .integration/evidence/inputs.json
            .integration/evidence/*.elf
            .integration/evidence/*.bin
            .integration/evidence/*.lock
            .integration/evidence/boot/*
            .integration/evidence/harts-*.log
            .integration/evidence/harts-*.json
            .integration/evidence/riscv64gc-unknown-none-elf/release/system-loader-guest
            .integration/evidence/riscv64gc-unknown-none-elf/release/system-loader-image
            .integration/toolchain/build/std.json
            .integration/toolchain/build/std/riscv64gc-unknown-vanllia/release/std-waits
            .integration/evidence/build/*
            .integration/evidence/resolve/*
            .integration/evidence/*-resolve/*
            .integration/evidence/*-locked/*
            .integration/evidence/harts-*/*.log
            .integration/evidence/harts-*/result.json
            .integration/evidence/candidate/inputs.json
            .integration/evidence/candidate/*.elf
            .integration/evidence/candidate/*.bin
            .integration/evidence/candidate/*.lock
            .integration/evidence/candidate/patches/*
            .integration/evidence/candidate/resolve/*
            .integration/evidence/candidate/locked/*
            .integration/evidence/candidate/harts-*/*.log
            .integration/evidence/candidate/harts-*/result.json
          if-no-files-found: warn

  comparison:
    name: Kernel-owned opt-in Room/IRQ benchmark
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.body, 'Room comparison: requested')
    needs: host
    uses: shuyra-arche/kernel/.github/workflows/room-comparison.yml@ec7adcde3d3c97b59630f52b000db3ded4f9e582
    with:
      kernel_sha: ${{ needs.host.outputs.kernel_sha }}
