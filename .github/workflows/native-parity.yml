name: Native parity lock preparation

on:
  pull_request:
    paths:
      - "tests/runner/**"
      - ".github/workflows/native-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate isolated native test lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install current Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt,clippy
      - name: Resolve and print exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly generate-lockfile --manifest-path tests/runner/Cargo.toml
          echo CARGO_LOCK_BASE64_BEGIN
          base64 -w0 tests/runner/Cargo.lock
          echo
          echo CARGO_LOCK_BASE64_END
          cargo +nightly test --locked --manifest-path tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
