schema = 1
units = ["login", "daemon"]

[boot]
system = "system"

[boot.kernel]
image = "shuyra"

[platform]
target = "riscv64gc-unknown-none-elf"
profile = "release"

[runner]
machine = "virt"
memory = "256M"
cpus = 1
timeout = 60

[sources.system]
path = "components/system"

[sources.kernel]
path = "components/kernel"

[sources.image-builder]
path = "components/image-builder"

[sources.driver]
path = "components/driver"

[sources.session]
path = "components/session"

[sources.pipe]
path = "components/pipe"

[sources.daemon]
path = "components/daemon"

[sources.shell]
path = "components/shell"

